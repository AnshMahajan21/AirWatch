      <path d="M 125 280 C 165 270 208 266 250 274 C 285 280 318 296 348 308 C 365 315 382 312 388 305" stroke-width="4.2" />
      <path d="M 145 298 C 182 292 222 294 258 308 C 282 318 305 328 322 322" stroke-width="4.0" />
      <path d="M 168 320 C 198 315 230 322 258 338 C 274 346 290 350 300 344" stroke-width="3.8" />
      <path d="M 198 342 C 224 340 250 348 272 362" stroke-width="3.6" />

      <!-- Subtle wind gust motion marks / ticks -->
      <path d="M 215 142 C 222 135 230 134 238 138" stroke-width="3.4" />
      <path d="M 206 160 C 214 152 222 154 228 160" stroke-width="3.4" />
      <path d="M 326 192 C 334 192 342 198 346 205" stroke-width="3.4" />
      <path d="M 335 208 C 340 210 345 216 346 222" stroke-width="3.4" />
      <path d="M 390 232 C 395 236 398 242 398 248" stroke-width="3.2" />
      <path d="M 308 238 C 314 234 320 235 324 240" stroke-width="3.2" />
      <path d="M 292 255 C 296 258 298 263 297 268" stroke-width="3.2" />
      <path d="M 226 354 C 232 360 238 362 245 360" stroke-width="3.4" />
      <path d="M 306 338 C 312 344 316 348 318 355" stroke-width="3.4" />
      <path d="M 168 260 C 174 256 182 256 188 260" stroke-width="3.0" />
    </g>
