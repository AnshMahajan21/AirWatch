    <!-- Crisp Black Line Art Matching User Drawing -->
    <g fill="none" stroke="#1C1917" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Top spiral swirl stroke -->
      <path d="M 218 220 C 220 182 232 144 268 135 C 296 128 325 146 325 178 C 325 210 296 232 265 225 C 248 220 244 204 252 192 C 262 178 282 184 284 198 C 285 208 275 212 268 208" />

      <!-- Right spiral swirl stroke -->
      <path d="M 268 238 C 298 218 342 205 372 222 C 392 236 395 265 378 286 C 360 304 328 300 320 278 C 316 260 332 246 348 252 C 360 258 358 274 348 278 C 340 280 336 272 340 266" />

      <!-- Bottom spiral swirl stroke -->
      <path d="M 188 280 C 215 302 238 330 262 352 C 282 368 308 360 314 338 C 320 314 298 294 272 296 C 254 298 245 314 254 328 C 264 338 280 335 282 324 C 284 314 274 308 268 312" />

      <!-- Horizontal streaming air flow lines -->
