<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Crisp Circular Dial Plate Matching Uploaded Logo -->
  <circle cx="250" cy="250" r="248" fill="#FFFFFF" />

  <!-- Clock Roman Numerals Perimeter -->
  <g font-family="Times New Roman, Baskerville, 'Playfair Display', Georgia, serif" font-weight="800" font-size="52" fill="#1C1917" text-anchor="middle" dominant-baseline="central">
    <text x="250" y="58" transform="rotate(0 250 250)">XII</text>
    <text x="250" y="58" transform="rotate(30 250 250)">I</text>
    <text x="250" y="58" transform="rotate(60 250 250)">II</text>
    <text x="250" y="58" transform="rotate(90 250 250)">III</text>
    <text x="250" y="58" transform="rotate(120 250 250)">IV</text>
    <text x="250" y="58" transform="rotate(150 250 250)">V</text>
    <text x="250" y="58" transform="rotate(180 250 250)">VI</text>
    <text x="250" y="58" transform="rotate(210 250 250)">VII</text>
    <text x="250" y="58" transform="rotate(240 250 250)">VIII</text>
    <text x="250" y="58" transform="rotate(270 250 250)">IX</text>
    <text x="250" y="58" transform="rotate(300 250 250)">X</text>
    <text x="250" y="58" transform="rotate(330 250 250)">XI</text>
  </g>

  <!-- Central Air / Wind Swirl Graphic -->
