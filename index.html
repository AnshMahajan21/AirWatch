    <script>
      // Gracefully catch and suppress dev WebSocket HMR errors in preview iframe (per environment constraints)
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        var stack = (reason && reason.stack) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite:ws') ||
          stack.includes('createWebSocketModuleRunnerTransport') ||
          stack.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var filename = event.filename || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          filename.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
